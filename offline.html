<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>عدم اتصال به اینترنت</title>
  <link rel="manifest" href="manifest.php">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/vazirmatn-font-face.css">
  <style>
    :root { --indigo: #6366f1; --indigo-dark: #4f46e5; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #1e293b;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.35);
      overflow: hidden;
      text-align: center;
    }
    .card-head {
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      color: #fff;
      padding: 34px 22px 28px;
    }
    .icon-wrap {
      width: 96px; height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap svg { width: 52px; height: 52px; }
    .card-head h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .card-head p { margin: 0; opacity: .9; font-size: .95rem; }
    .card-body { padding: 26px 24px 30px; }
    .card-body p { color: #475569; line-height: 1.9; font-size: .98rem; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .85rem; font-weight: 600;
      padding: 7px 14px; border-radius: 50px; margin-bottom: 18px;
    }
    .status.off { background: #fee2e2; color: #b91c1c; }
    .status.on  { background: #dcfce7; color: #15803d; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    .btn {
      -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
      width: 100%; min-height: 50px; font-size: 1.05rem; font-weight: 600;
      font-family: inherit;
      border-radius: 14px; padding: 12px 18px; margin-top: 8px;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      color: #fff; transition: transform .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(.98); }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .btn-secondary {
      background: #f1f5f9; color: #334155; margin-top: 12px;
    }
    .cached {
      margin-top: 22px; text-align: right;
      border-top: 1px solid #eef2f7; padding-top: 18px;
    }
    .cached h2 { font-size: .95rem; color: #334155; margin: 0 0 10px; }
    .cached ul { list-style: none; padding: 0; margin: 0; }
    .cached li {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .86rem; color: #64748b; padding: 7px 0;
      border-bottom: 1px dashed #eef2f7;
    }
    .cached li:last-child { border-bottom: 0; }
    .badge { background: #eef2ff; color: #4338ca; border-radius: 50px; padding: 2px 10px; font-weight: 600; }
    .muted { color: #94a3b8; font-size: .8rem; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22"/>
          <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 015.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0122.58 9"/>
          <path d="M1.42 9a15.91 15.91 0 014.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 016.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>به نظر می‌رسد دستگاه شما آفلاین است</p>
    </div>
    <div class="card-body">
      <span class="status off" id="conn-status"><span class="dot"></span> آفلاین</span>
      <p>
        برای استفاده از سیستم حسابداری به اتصال اینترنت نیاز دارید.
        لطفاً اتصال خود را بررسی کرده و دوباره تلاش کنید.
        صفحات و اطلاعاتی که قبلاً مشاهده کرده‌اید ممکن است به‌صورت محدود در دسترس باشند.
      </p>

      <button class="btn" id="retry-btn" type="button">تلاش مجدد</button>
      <button class="btn btn-secondary" id="home-btn" type="button">رفتن به صفحه اصلی</button>

      <div class="cached" id="cached-box" style="display:none">
        <h2>اطلاعات ذخیره‌شده در دستگاه</h2>
        <ul id="cached-list"></ul>
      </div>

      <p class="muted" id="last-sync"></p>
    </div>
  </main>

  <script>
    var statusEl = document.getElementById('conn-status');
    var retryBtn = document.getElementById('retry-btn');
    var homeBtn  = document.getElementById('home-btn');

    function setStatus() {
      if (navigator.onLine) {
        statusEl.className = 'status on';
        statusEl.innerHTML = '<span class="dot"></span> آنلاین — آماده اتصال';
      } else {
        statusEl.className = 'status off';
        statusEl.innerHTML = '<span class="dot"></span> آفلاین';
      }
    }

    function retry() {
      retryBtn.disabled = true;
      retryBtn.textContent = 'در حال بررسی اتصال…';
      var goHome = function () { window.location.replace('index.php?_=' + Date.now()); };
      var fail = function () {
        retryBtn.disabled = false;
        retryBtn.textContent = 'تلاش مجدد';
        setStatus();
        if (!navigator.onLine) {
          statusEl.innerHTML = '<span class="dot"></span> هنوز آفلاین هستید';
        }
      };
      // If online but SW is stuck serving offline responses, unregister + clear caches then reload.
      var resetSwThenReload = function () {
        var p = Promise.resolve();
        if ('serviceWorker' in navigator) {
          p = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        return p.then(function () {
          if (!('caches' in window)) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(goHome).catch(goHome);
      };
      fetch('index.php?ping=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
        .then(function (res) {
          if (res && res.ok) { goHome(); return; }
          if (navigator.onLine) return resetSwThenReload();
          fail();
        })
        .catch(function () {
          if (navigator.onLine) return resetSwThenReload();
          fail();
        });
    }

    retryBtn.addEventListener('click', retry);
    homeBtn.addEventListener('click', function () { window.location.href = 'index.php'; });
    window.addEventListener('online', function () { setStatus(); });
    window.addEventListener('offline', setStatus);
    setStatus();
    if (navigator.onLine) { /* came back while on page */ }

    // Show a summary of what is available offline from the Cache Storage.
    (function showCached() {
      if (!('caches' in window)) return;
      caches.keys().then(function (names) {
        var box = document.getElementById('cached-box');
        var list = document.getElementById('cached-list');
        Promise.all(names.map(function (n) {
          return caches.open(n).then(function (c) {
            return c.keys().then(function (reqs) { return { name: n, count: reqs.length }; });
          });
        })).then(function (rows) {
          rows = rows.filter(function (r) { return r.count > 0; });
          if (!rows.length) return;
          box.style.display = 'block';
          var labelMap = { static: 'فایل‌های برنامه (CSS/JS/تصاویر)', dynamic: 'صفحات بازدیدشده' };
          rows.forEach(function (r) {
            var li = document.createElement('li');
            var key = r.name.indexOf('static') > -1 ? 'static' : (r.name.indexOf('dynamic') > -1 ? 'dynamic' : r.name);
            var label = labelMap[key] || r.name;
            li.innerHTML = '<span>' + label + '</span><span class="badge">' + r.count + ' مورد</span>';
            list.appendChild(li);
          });
        });
      });
    })();

    // Last successful sync time (written by the app when online).
    try {
      var ls = localStorage.getItem('hesab_last_online');
      if (ls) {
        var d = new Date(parseInt(ls, 10));
        document.getElementById('last-sync').textContent =
          'آخرین اتصال موفق: ' + d.toLocaleString('fa-IR');
      }
    } catch (e) {}
  </script>
</body>
</html>
