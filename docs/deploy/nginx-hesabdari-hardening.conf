# Equivalent of the .htaccess rules when hesabdari runs behind nginx + php-fpm.
# Put inside the hesabdari server {} block (adjust the /hesabdari prefix if mounted at root).

# internal code and data — never served directly
location ~ ^/hesabdari/(api|templates|tests|tools|docs|backend|backups|logs|storage|analytics/lib)/ {
    deny all;
    return 404;
}
location ~ ^/hesabdari/(setup\.php|cron\.php|\.installed|DOCUMENTATION\.md|PWA_REPORT\.md)$ {
    # cron.php: keep only if an external HTTP cron is used (it checks ?secret=);
    # setup.php: re-enable temporarily for upgrades (?upgrade=1 needs a login)
    deny all;
    return 404;
}
# uploads: images only, never execute scripts
location ~* ^/hesabdari/uploads/.*\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$ {
    deny all;
    return 404;
}
